appId: dev.pid.app
productName: PID
directories:
  output: release
files:
  - out/**
  - package.json
  # PID's own bridge extension, loaded into every session worker (src/main/pi/bundled.ts).
  - resources/pid-bridge/**
# No asar: a session worker reads pid-bridge off disk as a plain file, and it cannot look inside an
# archive.
asar: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
