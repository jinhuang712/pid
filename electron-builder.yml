appId: dev.pid.app
productName: PID
directories:
  output: release
files:
  - out/**
  - package.json
  # Extensions PID loads into `pi --mode rpc` with -e (see src/main/pi/bundled.ts).
  - resources/pid-bridge/**
# No asar: the `pi` child process is a plain Node program that reads pid-bridge and the bundled
# pi-mcp-adapter (plus its node_modules) straight from disk, and it cannot look inside an archive.
asar: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
