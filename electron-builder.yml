appId: dev.pid.app
productName: PID
directories:
  output: release
files:
  - out/**
  - package.json
# No asar: a session worker loads the user's own extensions off disk through jiti, and it cannot
# look inside an archive.
asar: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
